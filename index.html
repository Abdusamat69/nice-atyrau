<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nice_Atyrau — магазин</title>
  <meta name="description" content="Nice_Atyrau — товары для дома, посуда и детские игрушки" />
  <style>
    :root {
      --brand-blue: #0057b8;
      --brand-yellow: #ffd700;
      --bg-light: #f7f9fb;
      --text-dark: #222;
    }
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: var(--bg-light);
      color: var(--text-dark);
    }
    header {
      background: var(--brand-blue);
      color: white;
      text-align: center;
      padding: 1rem 0;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .contacts {
      background: var(--brand-yellow);
      color: #000;
      text-align: center;
      padding: 0.5rem;
      font-weight: 500;
    }
    main {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card h3 {
      margin: 0.5rem 0;
      color: var(--brand-blue);
      font-size: 1.1rem;
    }
    .card p {
      margin: 0 0 0.5rem 0;
      font-weight: 600;
    }
    .back-btn {
      display: none;
      background: var(--brand-blue);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      margin: 1rem;
      cursor: pointer;
      font-weight: 500;
    }
    .back-btn:hover {
      background: #004799;
    }
    .search-box {
      display: none;
      max-width: 400px;
      margin: 1rem auto;
      text-align: center;
    }
    .search-box input {
      width: 90%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    footer {
      background: var(--brand-blue);
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>Nice_Atyrau</header>
  <div class="contacts">
    📞 +7 778 222 2191 &nbsp; | &nbsp; 💳 BCK • Forte • Kaspi
  </div>

  <button class="back-btn" onclick="showCategories()">⬅ Назад</button>

  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="Поиск по товарам..." oninput="filterProducts()" />
  </div>

  <main id="content">
    <p style="text-align:center;">Загрузка...</p>
  </main>

  <footer>© 2025 Nice_Atyrau — Все права защищены</footer>

  <script>
    const SHEET_ID = "1wqIQ77ssQWF1oHXLkUnv9b04ob4rApW5HM5YglOvdAo";
    const GITHUB_BASE = "https://raw.githubusercontent.com/Abdusamat69/nice-atyrau/main";
    const API_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

    let allData = {};
    let currentCategory = "";

    async function fetchSheet(sheetName) {
      const url = `${API_URL}&sheet=${encodeURIComponent(sheetName)}`;
      const res = await fetch(url);
      const text = await res.text();
      return JSON.parse(text.substr(47).slice(0, -2));
    }

    async function loadCategories() {
      const json = await fetchSheet("Категории");
      const rows = json.table.rows;
      const content = document.getElementById("content");
      content.innerHTML = "";

      rows.forEach(row => {
        const name = row.c[0]?.v || "";
        const photo = row.c[1]?.v || "";
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${GITHUB_BASE}${photo}" alt="${name}">
          <h3>${name}</h3>
        `;
        card.onclick = () => loadCategoryItems(name);
        content.appendChild(card);
      });

      document.querySelector(".back-btn").style.display = "none";
      document.getElementById("searchBox").style.display = "none";
    }

    async function loadCategoryItems(categoryName) {
      try {
        const json = await fetchSheet(categoryName);
        const rows = json.table.rows;
        const content = document.getElementById("content");
        content.innerHTML = "";

        rows.forEach(r => {
          const name = r.c[0]?.v || "";
          const desc = r.c[1]?.v || "";
          const price = r.c[2]?.v || "";
          const photo = r.c[3]?.v || "";
          const card = document.createElement("div");
          card.className = "card product";
          card.innerHTML = `
            <img src="${GITHUB_BASE}${photo}" alt="${name}">
            <h3>${name}</h3>
            <p>${price ? price + " ₸" : ""}</p>
            <small>${desc}</small>
          `;
          content.appendChild(card);
        });

        currentCategory = categoryName;
        document.querySelector(".back-btn").style.display = "inline-block";
        document.getElementById("searchBox").style.display = "block";
      } catch (e) {
        document.getElementById("content").innerHTML = "<p style='text-align:center;color:red;'>Ошибка загрузки товаров</p>";
        console.error(e);
      }
    }

    function showCategories() {
      loadCategories();
      currentCategory = "";
    }

    function filterProducts() {
      const value = document.getElementById("searchInput").value.toLowerCase();
      document.querySelectorAll(".product").forEach(el => {
        const name = el.querySelector("h3").textContent.toLowerCase();
        el.style.display = name.includes(value) ? "" : "none";
      });
    }

    loadCategories();
  </script>
</body>
</html>
