<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nice-Atyrau</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0; padding: 0;
      background-color: #f4f4f9;
      color: #333;
    }

    header {
      background-color: #ffcc00;
      color: #0047ab;
      padding: 15px 0;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 15px;
    }

    .category-card {
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
      width: 180px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }

    .category-card:hover {
      transform: translateY(-5px);
    }

    .category-card img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .products {
      display: none;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 15px;
    }

    .product-card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 15px;
      width: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .product-name {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 5px;
      text-align: center;
    }

    .product-price {
      color: #0047ab;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .btn {
      background-color: #0047ab;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #003580;
    }

    .cart {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background-color: #0047ab;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #cart-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    .cart-content {
      background: #fff;
      border-radius: 10px;
      width: 90%;
      max-width: 400px;
      padding: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .cart-buttons {
      text-align: right;
      margin-top: 15px;
    }

  </style>
</head>
<body>
  <header>Nice-Atyrau</header>

  <div class="categories" id="categories"></div>
  <div class="products" id="products"></div>
  <div class="cart" onclick="toggleCart()">🛒</div>

  <div id="cart-modal">
    <div class="cart-content">
      <h3>Корзина</h3>
      <div id="cart-items"></div>
      <div class="cart-buttons">
        <button class="btn" onclick="sendToWhatsApp()">Оплатить Kaspi QR</button>
        <button class="btn" onclick="toggleCart()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1wqIQ77ssQWF1oHXLkUnv9b04ob4rApW5HM5YglOvdAo/pub?output=csv';
    const categoriesList = [
      "Посуды",
      "Игрушки и детские товары",
      "Органайзеры",
      "Аксессуары",
      "Хозтовары",
      "Для кухни",
      "Для дома и хозяйства"
    ];

    const categoriesDiv = document.getElementById("categories");
    const productsDiv = document.getElementById("products");
    let cart = [];

    async function fetchSheetCSV() {
      const res = await fetch(csvUrl);
      const text = await res.text();
      return text;
    }

    function parseCSV(text) {
      const rows = text.trim().split("\n").map(r => r.split(","));
      const headers = rows.shift();
      return rows.map(r => Object.fromEntries(r.map((v, i) => [headers[i], v])));
    }

    async function loadProductsFromSheet() {
      const csv = await fetchSheetCSV();
      const data = parseCSV(csv);

      categoriesDiv.innerHTML = categoriesList.map(cat => `
        <div class="category-card" onclick="showCategory('${cat}')">
          <img src="https://cdn-icons-png.flaticon.com/512/888/888879.png" alt="${cat}">
          <h4>${cat}</h4>
        </div>
      `).join("");

      window.productsData = data;
    }

    function showCategory(category) {
      categoriesDiv.style.display = "none";
      productsDiv.style.display = "flex";

      const filtered = window.productsData.filter(p => p.category.trim().toLowerCase() === category.trim().toLowerCase());

      productsDiv.innerHTML = filtered.map(p => `
        <div class="product-card">
          <img src="${p.image}" alt="${p.name}">
          <div class="product-name">${p.name}</div>
          <div class="product-price">${p.price} ₸</div>
          <button class="btn" onclick="addToCart('${p.name}', '${p.price}')">Добавить</button>
        </div>
      `).join("");
    }

    function addToCart(name, price) {
      cart.push({ name, price });
      alert(`${name} добавлен в корзину`);
    }

    function toggleCart() {
      const modal = document.getElementById("cart-modal");
      const itemsDiv = document.getElementById("cart-items");
      modal.style.display = modal.style.display === "flex" ? "none" : "flex";

      if (modal.style.display === "flex") {
        itemsDiv.innerHTML = cart.map(i => `
          <div class="cart-item">
            <span>${i.name}</span>
            <span>${i.price} ₸</span>
          </div>
        `).join("");
      }
    }

    function sendToWhatsApp() {
      const message = cart.map(i => `${i.name} — ${i.price} ₸`).join("%0A");
      const url = `https://wa.me/77014110470?text=Заказ:%0A${message}`;
      window.open(url, '_blank');
    }

    loadProductsFromSheet();
  </script>
</body>
</html>
