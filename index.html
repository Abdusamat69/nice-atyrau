<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nice_Atyrau — магазин</title>
<style>
  :root {
    --blue: #0057b8;
    --yellow: #ffcc00;
    --light: #f9f9f9;
    --text: #333;
  }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: var(--light); color: var(--text);
  }
  header {
    background: var(--blue); color: white; padding: 1rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1.2rem; margin: 0; }
  header input {
    border: none; padding: 0.5rem; border-radius: 5px; width: 150px;
  }
  .categories {
    display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
    padding: 1rem;
  }
  .category-btn {
    padding: 1.5rem; border-radius: 15px; color: white; font-weight: bold; text-align: center; cursor: pointer;
    transition: transform .2s; 
  }
  .category-btn:hover { transform: scale(1.05); }
  .products {
    display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    padding: 1rem;
  }
  .card {
    background: white; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    padding: 1rem; text-align: center;
  }
  .card img {
    width: 100%; height: 160px; object-fit: cover; border-radius: 10px;
    background: #f0f0f0; /* Фон для изображений-заглушек */
  }
  .card h3 { margin: 0.5rem 0; font-size: 1rem; }
  .card p { font-size: 0.9rem; color: #555; }
  .price { font-weight: bold; color: var(--blue); margin: 0.5rem 0; }
  .add-btn {
    background: var(--yellow); border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer;
  }
  .hidden { display: none; }
  .back-btn {
    margin: 1rem; background: var(--blue); color: white; padding: 0.5rem 1rem; border-radius: 8px; border: none;
  }
  footer {
    background: #eee; padding: 1rem; text-align: center; font-size: 0.9rem;
  }
  .cart {
    position: fixed; bottom: 1rem; right: 1rem; background: var(--yellow); padding: 1rem;
    border-radius: 12px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); cursor: pointer;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .cart-count {
    background: red; color: white; border-radius: 50%; width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
  }
  .cart-modal {
    position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
  }
  .cart-content {
    background:white; padding:1rem; border-radius:12px; width:90%; max-width:400px;
  }
  .cart-content h2 { margin-top:0; }
  .cart-item { display:flex; justify-content:space-between; padding:0.3rem 0; }
  .banks { display:flex; gap:1rem; margin:0.5rem 0; }
  .banks label { cursor:pointer; }
</style>
</head>
<body>

<header>
  <h1>Nice_Atyrau</h1>
  <input type="search" id="search" placeholder="Поиск...">
</header>

<main>
  <section id="categories" class="categories"></section>
  <button id="backBtn" class="back-btn hidden">← Назад к категориям</button>
  <section id="products" class="products hidden"></section>
</main>

<div id="cartButton" class="cart">
  🛒 Корзина
  <span id="cartCount" class="cart-count hidden">0</span>
</div>

<div id="cartModal" class="cart-modal hidden">
  <div class="cart-content">
    <h2>Корзина</h2>
    <div id="cartItems"></div>
    <input id="phoneInput" placeholder="Номер телефона" style="width:100%;padding:0.5rem;margin:0.5rem 0;">
    <div class="banks">
      <label><input type="radio" name="bank" value="Kaspi"> Kaspi</label>
      <label><input type="radio" name="bank" value="Halyk"> Halyk</label>
    </div>
    <button id="sendOrder" class="add-btn">Отправить заказ</button>
    <button id="closeCart" class="back-btn" style="background:#ccc;color:#333;margin-top:0.5rem;">Закрыть</button>
  </div>
</div>

<footer>📞 +7 778 222 2191 | Nice_Atyrau © 2025</footer>

<script>
const sheetBase = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTFGHz98qjo2NSLj9weXtHGR3H7P7hGCEj7i8cUvhuLCkdd2voxrPhomuFSHzRK5gtYV8qFDFfuleqH/pub?output=csv&sheet=";
const categories = ["Посуды","Игрушки","Органайзеры","Аксессуары","Хозтовары","Для кухни","Для дома и хозяйства"];
const catColors = ["#007BFF","#FFB400","#4CAF50","#E91E63","#9C27B0","#03A9F4","#8BC34A"];

const categoriesDiv = document.getElementById('categories');
const productsDiv = document.getElementById('products');
const backBtn = document.getElementById('backBtn');
const searchInput = document.getElementById('search');
const cartBtn = document.getElementById('cartButton');
const cartCount = document.getElementById('cartCount');
const cartModal = document.getElementById('cartModal');
const cartItemsDiv = document.getElementById('cartItems');
let allProducts = [];
let cart = JSON.parse(localStorage.getItem('cart') || '[]');

// Обновляем счетчик корзины при загрузке
updateCartCount();

function renderCategories() {
  categoriesDiv.innerHTML = '';
  categories.forEach((name, i) => {
    const btn = document.createElement('div');
    btn.textContent = name;
    btn.className = 'category-btn';
    btn.style.background = catColors[i % catColors.length];
    btn.onclick = () => loadCategory(name);
    categoriesDiv.appendChild(btn);
  });
}

async function loadCategory(name) {
  categoriesDiv.classList.add('hidden');
  backBtn.classList.remove('hidden');
  productsDiv.classList.remove('hidden');
  productsDiv.innerHTML = 'Загрузка...';
  try {
    // Для демонстрации используем заглушки вместо реальных данных
    // В реальном приложении здесь будет запрос к Google Sheets
    const demoProducts = [
      { name: "Товар 1", desc: "Описание товара 1", price: "2500", photo: "/images/product1.jpg" },
      { name: "Товар 2", desc: "Описание товара 2", price: "3500", photo: "/images/product2.jpg" },
      { name: "Товар 3", desc: "Описание товара 3", price: "4500", photo: "/images/product3.jpg" }
    ];
    
    allProducts = demoProducts;
    renderProducts(demoProducts);
  } catch (e) {
    productsDiv.innerHTML = 'Ошибка загрузки данных.';
    console.error('Ошибка загрузки категории:', e);
  }
}

function renderProducts(items) {
  productsDiv.innerHTML = '';
  if (items.length === 0) {
    productsDiv.innerHTML = '<p>Товары не найдены</p>';
    return;
  }
  
  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="https://via.placeholder.com/300x200?text=Изображение+товара" alt="${p.name}">
      <h3>${p.name}</h3>
      <p>${p.desc}</p>
      <div class="price">${p.price} ₸</div>
      <button class="add-btn">Добавить</button>`;
    card.querySelector('.add-btn').onclick = () => addToCart(p);
    productsDiv.appendChild(card);
  });
}

searchInput.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  const filteredProducts = allProducts.filter(p => 
    p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)
  );
  renderProducts(filteredProducts);
});

backBtn.onclick = () => {
  productsDiv.classList.add('hidden');
  backBtn.classList.add('hidden');
  categoriesDiv.classList.remove('hidden');
  searchInput.value = '';
};

function addToCart(p) {
  cart.push(p);
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  alert('Добавлено в корзину!');
}

function updateCartCount() {
  const count = cart.length;
  if (count > 0) {
    cartCount.textContent = count;
    cartCount.classList.remove('hidden');
  } else {
    cartCount.classList.add('hidden');
  }
}

cartBtn.onclick = () => {
  cartModal.classList.remove('hidden');
  renderCart();
};
document.getElementById('closeCart').onclick = () => cartModal.classList.add('hidden');

function renderCart() {
  if (cart.length === 0) {
    cartItemsDiv.innerHTML = 'Корзина пуста.';
    return;
  }
  
  cartItemsDiv.innerHTML = cart.map((c,i)=>`
    <div class="cart-item">
      <div>
        <strong>${c.name}</strong><br>
        <small>${c.price}₸</small>
      </div>
      <button onclick="removeFromCart(${i})">❌</button>
    </div>`).join('');
}

function removeFromCart(i) {
  cart.splice(i,1);
  localStorage.setItem('cart', JSON.stringify(cart));
  updateCartCount();
  renderCart();
}

document.getElementById('sendOrder').onclick = () => {
  const phone = document.getElementById('phoneInput').value.trim();
  const bank = document.querySelector('input[name="bank"]:checked')?.value;
  
  if (!phone) {
    return alert('Введите номер телефона.');
  }
  
  if (!bank) {
    return alert('Выберите банк для оплаты.');
  }
  
  if (cart.length === 0) {
    return alert('Корзина пуста.');
  }
  
  // В реальном приложении здесь будет отправка данных на сервер
  console.log('Заказ отправлен:', {phone, bank, cart});
  
  alert('Ваш заказ отправлен оператору!\nТелефон: '+phone+'\nБанк: '+bank);
  cart = [];
  localStorage.removeItem('cart');
  updateCartCount();
  renderCart();
  cartModal.classList.add('hidden');
};

renderCategories();
</script>

</body>
</html>
